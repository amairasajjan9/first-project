<!DOCTYPE html>
<html>
<head>
    <title>skills</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --bg-panel: #12161f;
    --bg-card: #161b26;
    --border: #232a38;
    --text: #e6e9ef;
    --text-dim: #8891a3;
    --accent: #7ee787;
    --accent-2: #ffab70;
    --keyword: #ff7b72;
    --string: #a5d6ff;
    --func: #d2a8ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  /* body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  } */

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;

    display: flex;
    flex-direction: column;
    /* justify-content: center;  Vertical center  */
    align-items: center;     /* Horizontal center */
    min-height: 100vh;
    text-align: center;
}

  a { color: inherit; text-decoration: none; }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Nav ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 60px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  nav ul {
    list-style: none;
    display: flex;
    gap: 36px;
  }

  nav a {
    font-size: 15px;
    color: var(--text-dim);
    transition: color 0.2s;
  }
  nav a:hover { color: var(--accent); }

  .nav-icons {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .nav-icons a {
    color: var(--text-dim);
    font-size: 18px;
  }
  .nav-icons a:hover { color: var(--accent); }

  /* ---------- Hero ---------- */
  .hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 90px 40px 60px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .hero-text .eyebrow {
    color: var(--accent);
    font-size: 15px;
    margin-bottom: 14px;
    display: block;
  }

  .hero-text h1 {
    font-size: 44px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 20px;
  }

  .hero-text p {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 460px;
    margin-bottom: 30px;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d1117;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-outline {
    border-color: var(--border);
    color: var(--text);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* code editor mockup */
  .editor {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .editor-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #161b26;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .editor-tab {
    margin-left: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .editor-body {
    padding: 22px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.9;
    overflow-x: auto;
  }
  .ln { color: #495168; display: inline-block; width: 22px; user-select: none; }
  .kw { color: var(--keyword); }
  .str { color: var(--string); }
  .fn { color: var(--func); }
  .cm { color: #6e7681; }
  .prop { color: #79c0ff; }

  /* ---------- Section shells ---------- */
  section { max-width: 1100px; margin: 0 auto; padding: 90px 40px; }
  .section-head { margin-bottom: 46px; }
  .section-head .tag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 14px;
    display: block;
    margin-bottom: 8px;
  }
  .section-head h2 { font-size: 32px; font-weight: 700; }

  /* ---------- Projects ---------- */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }

  .project-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s;
  }
  .project-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  .project-thumb {
    height: 150px;
    background: linear-gradient(135deg, #1b2130, #232a38);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    font-size: 13px;
  }

  .project-body { padding: 20px 22px 24px; flex: 1; display: flex; flex-direction: column; }
  .project-body h3 { font-size: 18px; margin-bottom: 10px; }
  .project-body p { color: var(--text-dim); font-size: 14px; flex: 1; margin-bottom: 16px; }

  .stack-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #1b2130;
    color: var(--accent-2);
    border: 1px solid var(--border);
  }

  .project-links { display: flex; gap: 18px; font-size: 13.5px; }
  .project-links a { color: var(--text-dim); }
  .project-links a:hover { color: var(--accent); }

  /* ---------- Skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }
  .skill-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 20px;
  }
  .skill-card h4 {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 13px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }
  .skill-card ul { list-style: none; }
  .skill-card li {
    font-size: 14px;
    color: var(--text-dim);
    padding: 5px 0;
  }

  /* ---------- Contact ---------- */
  .contact-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 50px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }
  .contact-item .label {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 13px;
    display: block;
    margin-bottom: 8px;
  }
  .contact-item .value { font-size: 18px; font-weight: 500; }

  .socials { display: flex; gap: 20px; margin-top: 40px; }
  .socials a {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }
  .socials a:hover { color: var(--accent); border-color: var(--accent); }

  footer {
    text-align: center;
    padding: 30px;
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--border);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    header { padding: 16px 24px; }
    nav ul { display: none; }
    .hero { grid-template-columns: 1fr; padding: 60px 24px; }
    section { padding: 60px 24px; }
    .project-grid { grid-template-columns: repeat(2, 1fr); }
    .skills-grid { grid-template-columns: repeat(2, 1fr); }
    .contact-box { grid-template-columns: 1fr; padding: 32px; }
  }
  @media (max-width: 560px) {
    .hero-text h1 { font-size: 32px; padding: 16px; }
    .project-grid { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr 1fr; }
  }

  .p {
    font-size: 14px;
    color: var(--text-dim);
    padding: 5px 0;
    margin-top:10px
  }
</style>
</head>
<body>

<h1>skills</h1>

<p>This is the skills page.</p>


</body>
</html>
